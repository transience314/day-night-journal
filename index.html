<!DOCTYPE html>
<html>
  <head>
    <title>My Journal</title>
    <style>
        :root {
        --bg: #0a0e1a;
        --text: #c9d1e0;
        --text-dim: #8a93a8;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: Georgia, serif;
            margin: 0;
            padding: 80px 40px;
            line-height: 1.7;
            transition: background-color 1.5s, color 1.5s;
        }
        h1 {
            font-size: 42px;
            font-weight: normal;
            letter-spacing: 1px;
        }
        p {
            font-size: 18px;
            max-width: 600px;
            color: var(--text-dim);
        }
        textarea {
        display: block;
        width: 100%;
        max-width: 600px;
        height: 160px;
        margin-top: 16px;
        padding: 16px;
        background-color: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--text-dim);
        border-radius: 6px;
        color: var(--text);
        font-family: Georgia, serif;
        font-size: 17px;
        line-height: 1.6;
        box-sizing: border-box;
        resize: vertical;
        }
        button {
            margin-top: 16px;
            padding: 10px 24px;
            background-color: transparent;
            border: 1px solid var(--text-dim);
            border-radius: 6px;
            color: var(--text);
            font-family: Georgia, serif;
            font-size: 15px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: rgba(255, 255, 255, 0.08);
        }
        .entry-item {
            max-width: 600px;
            margin-top: 20px;
            padding: 16px;
            border-left: 2px solid var(--text-dim);
            background-color: rgba(255, 255, 255, 0.03);
            color: var(--text);
            line-height: 1.6;
            white-space: pre-wrap;
        }
        #clock {
        font-size: 14px;
        letter-spacing: 2px;
        color: var(--text-dim);
        margin-bottom: 8px;
        }
        #stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 2s;
            z-index: -1;
        }
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background-color: #ffffff;
            border-radius: 50%;
        }
        #sun {
            position: fixed;
            right: 80px;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle, #fff4d6 0%, #ffd97a 55%, #ffb347 100%);
            box-shadow: 0 0 60px 20px rgba(255, 200, 90, 0.45);
            opacity: 0;
            transition: opacity 2s;
            pointer-events: none;
            z-index: -1;
        }
    </style>
  </head>
  <body>
    <div id="sun"></div>
    <div id="stars"></div>
    <div id="clock"></div>
    <h1 id="greeting">Hello, night.</h1>
    <p>Your personal perpetual journal.</p>
    <p id="prompt">What's on your mind?</p>
    <textarea id="entry" placeholder="Begin writing..."></textarea>
    <button id="save">Save entry</button>

    <div id="entries"></div>

    <script>
        let now = new Date();
        let hour = 17;
        let phase = "";

        if (hour >= 5 && hour < 12) {
            phase = "morning";
        } else if (hour >= 12 && hour < 18) {
            phase = "afternoon";
        } else if (hour >= 18 && hour < 22) {
            phase = "evening";
        } else {
            phase = "night";
        }

        let greetingEl = document.getElementById("greeting");
        let saveButton = document.getElementById("save");
        let entryBox = document.getElementById("entry");
        let entriesContainer = document.getElementById("entries");
        let starsContainer = document.getElementById("stars");

        let entries = [];

        let greetings = {
            morning: "Good morning.",
            afternoon: "Good afternoon.",
            evening: "Good evening.",
            night: "Still awake?"
        };

        let palettes = {
            morning: { bg: "#dce4f0", text: "#2a3142", dim: "#5a6478" },
            afternoon: { bg: "#e8eef5", text: "#1e2533", dim: "#4a5468" },
            evening: { bg: "#2a1f2e", text: "#e8d5c4", dim: "#b89a85" },
            night: { bg: "#0a0e1a", text: "#c9d1e0", dim: "#8a93a8" }
        };

        greetingEl.textContent = greetings[phase];

        let colors = palettes[phase];
        document.documentElement.style.setProperty("--bg", colors.bg);
        document.documentElement.style.setProperty("--text", colors.text);
        document.documentElement.style.setProperty("--text-dim", colors.dim);

        for (let i = 0; i < 80; i++) {
            let star = document.createElement("div");
            star.className = "star";
            star.style.top = Math.random() * 100 + "%";
            star.style.left = Math.random() * 100 + "%";
            star.style.opacity = Math.random();
            starsContainer.appendChild(star);
        }

        if (phase === "evening" || phase === "night") {
            starsContainer.style.opacity = "1";
        }

        if (phase === "morning") {
            let sun = document.getElementById("sun");
            sun.style.top = "220px";
            sun.style.opacity = "1";
        } else if (phase === "afternoon") {
            let sun = document.getElementById("sun");
            sun.style.top = "260px";
            sun.style.opacity = "1";
        }

        function saveToStorage() {
            localStorage.setItem("journal-entries", JSON.stringify(entries));
        }

        function loadFromStorage() {
            let saved = localStorage.getItem("journal-entries");
            if (saved !== null) {
                entries = JSON.parse(saved);
            }
        }

        function renderEntries() {
            entriesContainer.innerHTML = "";
            for (let i = 0; i < entries.length; i++) {
                let entryDiv = document.createElement("div");
                entryDiv.className = "entry-item";
                entryDiv.textContent = entries[i];
                entriesContainer.appendChild(entryDiv);
            }
        }

        function updateClock() {
            let clockNow = new Date();
            let h = clockNow.getHours();
            let m = clockNow.getMinutes();
            let mm = (m < 10) ? "0" + m : m;
            document.getElementById("clock").textContent = h + ":" + mm;
        }

        saveButton.addEventListener("click", function() {
            let text = entryBox.value;
            if (text === "") {
                return;
            }
            entries.push(text);
            saveToStorage();
            renderEntries();
            entryBox.value = "";
        });

        updateClock();
        setInterval(updateClock, 1000);

        loadFromStorage();
        renderEntries();
    </script>
  </body>
</html>
